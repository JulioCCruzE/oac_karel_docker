[program:jupyter]
command=/usr/local/bin/jupyter-start.sh
user=developer
directory=/workspace
environment=ROS_DISTRO="%(ENV_ROS_DISTRO)s"
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
