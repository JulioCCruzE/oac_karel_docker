x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  xserver:
    image: devrt/xserver@sha256:d0960e1f0e8c0cd1b1c046924c37f900b8563d94dca3edfc974d106b4ba0fd2e
    shm_size: 256m
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - x11:/tmp/.X11-unix
    logging: *default-logging
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "test -e /tmp/.X11-unix/X0"]
      interval: "1s"
      timeout: "2s"
      retries: 20
  simulator:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile
    image: oac_karel_docker:latest
    init: true
    shm_size: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DISPLAY: ":0"
      KAREL_WORLD: ${KAREL_WORLD:-circuit_single_obstacle}
      KAREL_OBSTACLE_SEED: ${KAREL_OBSTACLE_SEED:-1}
      KAREL_GUI: ${KAREL_GUI:-true}
      ALSOFT_DRIVERS: "null"
      GAZEBO_MODEL_DATABASE_URI: ""
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ./src:/repo/src:ro
      - x11:/tmp/.X11-unix
    logging: *default-logging
    pids_limit: 1024
    depends_on:
      xserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'test -f /catkin_ws/devel/setup.bash && source /catkin_ws/devel/setup.bash && supervisorctl -c /etc/supervisor/supervisord.conf status simulator | grep -q RUNNING && pgrep -x gzserver >/dev/null && rosservice call /gazebo/get_world_properties >/dev/null'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s
  workspace:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.workspace
    image: oac_karel_workspace:latest
    platform: linux/amd64
    init: true
    shm_size: 512m
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:3002:8888"
    volumes:
      - .:/workspace
      - x11:/tmp/.X11-unix
    environment:
      DISPLAY: ":0"
      ROS_MASTER_URI: http://simulator:11311/
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
    logging: *default-logging
    pids_limit: 1024
    depends_on:
      xserver:
        condition: service_healthy
      simulator:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8888/api >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  x11:
